<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotlight 5 PRE-01 — School Match</title><style>
:root{--ink:#18304a;--muted:#61768c;--blue:#4169e1;--mint:#1f9d7a;--soft:#eef5ff;--line:#d7e5f3;--ok:#eaf9f2;--bad:#fff0f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(145deg,#eef6ff,#f9f6ff 55%,#effcf7);color:var(--ink);min-height:100vh}.app{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,38px);margin:0}.sub{color:var(--muted);font-weight:700;margin:6px 0 16px}.score{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:900}.board{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 26px #18304a12}.panel h2{margin:0 0 12px;font-size:20px}.item{width:100%;border:2px solid var(--line);background:#fff;border-radius:15px;padding:14px 12px;margin:8px 0;font-size:17px;font-weight:850;text-align:left;cursor:pointer;transition:.15s}.item:hover{transform:translateY(-1px);border-color:#9db8ed}.item.sel{border-color:var(--blue);background:var(--soft)}.item.done{border-color:#72c5a7;background:var(--ok);color:#12654a;cursor:default}.feedback{margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-height:64px;font-weight:700}.speak{margin-top:8px;padding:10px 12px;background:#fff7df;border:1px solid #e9cc75;border-radius:12px;color:#6a5012}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}.btn{border:0;border-radius:13px;padding:11px 16px;background:#334b62;color:#fff;font-weight:900;cursor:pointer}@media(max-width:700px){.board{grid-template-columns:1fr}.app{padding:10px}}</style></head><body><div class="app"><div class="top"><div><h1>Spotlight 5 • Ready for School</h1><div class="sub">MATCH → READ → SAY A SENTENCE</div></div><div class="score" id="score">0 / 10</div></div><div class="board"><section class="panel"><h2>School subjects</h2><div id="left"></div></section><section class="panel"><h2>What do we do?</h2><div id="right"></div></section></div><div class="feedback" id="fb">Choose one subject and one action.</div><div class="actions"><button class="btn" id="restart">Restart</button></div></div><script>
const pairs=[['Maths','work with numbers'],['English','speak, read and learn words'],['PE','play sports'],['Art','draw and paint'],['Geography','learn about countries and maps'],['History','learn about the past'],['Science','do experiments'],['IT','use computers'],['Music','sing or play instruments'],['Literature','read stories and books']];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);let L=null,R=null,good=0;const left=document.getElementById('left'),right=document.getElementById('right'),fb=document.getElementById('fb'),score=document.getElementById('score');
function sound(ok){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?680:220;g.gain.value=.04;o.start();o.stop(c.currentTime+.08)}catch(e){}}
function render(){good=0;L=R=null;score.textContent='0 / '+pairs.length;left.innerHTML=pairs.map((p,i)=>`<button class="item" data-i="${i}" data-side="L">${p[0]}</button>`).join('');const ord=shuffle(pairs.map((p,i)=>i));right.innerHTML=ord.map(i=>`<button class="item" data-i="${i}" data-side="R">${pairs[i][1]}</button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>pick(b));fb.textContent='Choose one subject and one action.'}
function pick(b){if(b.classList.contains('done'))return;const side=b.dataset.side;document.querySelectorAll(`[data-side="${side}"]`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(side==='L')L=b;else R=b;if(L&&R)check()}
function check(){const ok=L.dataset.i===R.dataset.i;sound(ok);if(ok){L.classList.remove('sel');R.classList.remove('sel');L.classList.add('done');R.classList.add('done');good++;score.textContent=`${good} / ${pairs.length}`;const s=pairs[+L.dataset.i];fb.innerHTML=`✓ <b>${s[0]} — ${s[1]}</b><div class="speak">🎤 Say it: “In ${s[0]} we ${s[1]}.”</div>`;if(good===pairs.length)fb.innerHTML=`⭐ All matched!<div class="speak">🎤 Final challenge: choose any 3 subjects and make 3 full sentences without looking.</div>`}else{L.classList.remove('sel');R.classList.remove('sel');fb.innerHTML='✗ Not this pair. Try again.'}L=R=null}
document.getElementById('restart').onclick=render;render();</script></body></html>
