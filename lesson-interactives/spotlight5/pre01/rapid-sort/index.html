<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotlight 5 PRE-01 — Rapid Sort</title><style>:root{--ink:#18324b;--muted:#60758a;--blue:#4369de;--line:#d9e5f2;--ok:#eaf9f2;--bad:#fff0f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(145deg,#eef7ff,#faf7ff);color:var(--ink);min-height:100vh}.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{margin:0;font-size:clamp(24px,4vw,38px)}.sub{color:var(--muted);font-weight:800;margin:6px 0 16px}.score{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:900}.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,36px);box-shadow:0 12px 30px #18324b12}.phrase{font-size:clamp(28px,5vw,44px);line-height:1.25;font-weight:900;text-align:center;margin:18px 0 26px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{border:0;border-radius:18px;padding:18px;font-size:22px;font-weight:900;cursor:pointer}.yes{background:#e7f8ef;color:#126544}.no{background:#fff0f0;color:#963d3d}.feedback{min-height:80px;margin-top:18px;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:750}.speak{margin-top:10px;background:#fff6d9;border:1px solid #ebcd73;border-radius:12px;padding:10px 12px;color:#675012}.next{display:none;margin:16px 0 0 auto;border:0;border-radius:14px;padding:12px 18px;background:var(--blue);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.finish{text-align:center;font-size:28px;font-weight:900;padding:24px}@media(max-width:600px){.buttons{grid-template-columns:1fr}.app{padding:10px}}</style></head><body><div class="app"><div class="top"><div><h1>Rapid Sort</h1><div class="sub">CORRECT or WRONG? → EXPLAIN → SAY</div></div><div class="score" id="score"></div></div><main class="card" id="card"></main></div><script>
const tasks=[['Have English on Monday.',true,'We have English on Monday.'],['Do English on Monday.',false,'We have English on Monday.'],['Do experiments in Science.',true,'We do experiments in Science.'],['Play experiments in Science.',false,'We do experiments in Science.'],['Use a computer in IT.',true,'We use a computer in IT.'],['Read countries in Geography.',false,'We learn about countries and maps in Geography.'],['Learn about the past in History.',true,'We learn about the past in History.'],['Draw a picture in Art.',true,'We draw pictures in Art.'],['Have football in PE.',false,'We play football in PE.'],['Play football in PE.',true,'We play football in PE.'],['At Monday.',false,'On Monday.'],['On Monday.',true,'On Monday.'],['On 9 o’clock.',false,'At 9 o’clock.'],['At 9 o’clock.',true,'At 9 o’clock.'],['She goes to school.',true,'She goes to school.'],['She go to school.',false,'She goes to school.'],['Does she like Maths?',true,'Does she like Maths?'],['Does she likes Maths?',false,'Does she like Maths?']];let i=0,good=0;const card=document.getElementById('card'),score=document.getElementById('score');
function sound(ok){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?700:220;g.gain.value=.04;o.start();o.stop(c.currentTime+.08)}catch(e){}}
function render(){if(i>=tasks.length){score.textContent=`${good} / ${tasks.length}`;card.innerHTML=`<div class="finish">⭐ ${good} / ${tasks.length}<div class="speak">🎤 Final challenge: choose 3 wrong sentences from memory and correct them aloud.</div><button class="next" style="display:block" onclick="i=0;good=0;render()">Play again</button></div>`;return}score.textContent=`${good} points • ${i+1}/${tasks.length}`;card.innerHTML=`<div class="phrase">${tasks[i][0]}</div><div class="buttons"><button class="choice yes" data-v="1">✓ CORRECT</button><button class="choice no" data-v="0">✗ WRONG</button></div><div class="feedback" id="fb">Choose quickly. Then explain your answer.</div><button class="next" id="next">Next →</button>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.v==='1'))}
function choose(v){const t=tasks[i],ok=v===t[1];if(ok)good++;sound(ok);document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('fb').innerHTML=`<b>${ok?'✓ Correct!':'✗ Not quite.'}</b><br>${t[2]}<div class="speak">🎤 Say the correct form aloud and make one similar sentence.</div>`;document.getElementById('next').style.display='block';document.getElementById('next').onclick=()=>{i++;render()};score.textContent=`${good} points • ${i+1}/${tasks.length}`}
render();</script></body></html>
