<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotlight 5 PRE-01 — Correct the Teacher</title><style>:root{--ink:#19334c;--muted:#60758a;--blue:#486bdc;--line:#d8e5f2;--soft:#eef4ff;--ok:#eaf9f1}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(145deg,#f2f7ff,#fffaf2);color:var(--ink);min-height:100vh}.app{max-width:920px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.head h1{margin:0;font-size:clamp(24px,4vw,38px)}.sub{color:var(--muted);font-weight:800;margin:6px 0 16px}.pill{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:900}.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 30px #19334c12}.tag{display:inline-block;background:var(--soft);color:var(--blue);padding:7px 12px;border-radius:999px;font-weight:900}.wrong{font-size:clamp(24px,4vw,36px);line-height:1.35;font-weight:900;margin:22px 0}.prompt{padding:12px 14px;background:#fff5d9;border:1px solid #e8ca70;border-radius:14px;font-weight:850}.answer{margin-top:16px;padding:16px;border-radius:16px;background:var(--ok);border:1px solid #7fc8a9;font-size:clamp(20px,3vw,28px);font-weight:900;display:none}.note{margin-top:10px;color:var(--muted);font-weight:700}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:14px;padding:13px 18px;font-size:17px;font-weight:900;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#334b62}.finish{text-align:center;font-size:26px;font-weight:900;padding:28px 10px}.speak{margin-top:12px;padding:12px 14px;background:#fff5d9;border-radius:14px;color:#684f12}@media(max-width:620px){.app{padding:10px}.actions{justify-content:stretch}.btn{flex:1}}</style></head><body><div class="app"><div class="head"><div><h1>Correct the Teacher</h1><div class="sub">NOTICE → CORRECT → SAY THE FULL SENTENCE</div></div><div class="pill" id="count"></div></div><main class="card" id="card"></main></div><script>
const tasks=[['Geography is a school object.','Geography is a school subject.'],['We do English on Monday.','We have English on Monday.'],['She go to school at eight.','She goes to school at eight.'],['They is in Class 5B.','They are in Class 5B.'],['I have a orange pencil case.','I have an orange pencil case.'],['Does he likes Science?','Does he like Science?'],['We have PE at Tuesday.','We have PE on Tuesday.'],['Lessons start on nine o’clock.','Lessons start at nine o’clock.'],['A timetable tells us what food to buy.','A timetable tells us the school schedule.'],['He don’t have Maths today.','He doesn’t have Maths today.']];let i=0;const card=document.getElementById('card'),count=document.getElementById('count');
function render(){if(i>=tasks.length){card.innerHTML=`<div class="finish">⭐ Great job!<div class="speak">🎤 Final challenge: make 3 new wrong school sentences for the teacher to correct.</div><div class="actions"><button class="btn secondary" onclick="i=0;render()">Play again</button></div></div>`;count.textContent=`10 / 10`;return}const t=tasks[i];count.textContent=`${i+1} / ${tasks.length}`;card.innerHTML=`<span class="tag">Teacher says…</span><div class="wrong">“${t[0]}”</div><div class="prompt">🎤 Correct it aloud before you reveal the answer.</div><div class="answer" id="ans">✓ ${t[1]}<div class="note">Now say the whole correct sentence one more time.</div></div><div class="actions"><button class="btn secondary" id="show">Show answer</button><button class="btn" id="next" disabled>Next →</button></div>`;document.getElementById('show').onclick=()=>{document.getElementById('ans').style.display='block';document.getElementById('next').disabled=false};document.getElementById('next').onclick=()=>{i++;render()}}
render();</script></body></html>
