<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Shooter</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="adventure.css"><link rel="stylesheet" href="animations.css"><link rel="stylesheet" href="core.css"><style>body{--glow:#124aa8;--head:#073b84;--accent:#24c7ff}.sky{position:relative;height:260px;margin-top:18px;border:1px solid #39caff44;border-radius:24px;background:radial-gradient(circle at 50% 100%,#154ba0,#071139 65%);overflow:hidden;cursor:crosshair}.sky:before{content:"✦ · ✧ · ✦ · ✧";position:absolute;inset:15px;color:#8ddcff66;font-size:25px;letter-spacing:28px}.target{position:absolute;width:29%;min-height:62px;border:2px solid #4cd7ff;border-radius:50px;color:#fff;background:#123f80e8;font:900 clamp(14px,2vw,19px) Nunito;cursor:crosshair;box-shadow:0 0 20px #1fc8ff55;animation:float 2.2s ease-in-out infinite alternate}.target:nth-of-type(2){animation-delay:-.7s}.target:nth-of-type(3){animation-delay:-1.4s}.target.hit{background:#139d72;border-color:#5affc0}.target.miss{background:#8e2844;border-color:#ff7184}.blaster{position:absolute;bottom:10px;left:50%;font-size:45px;transform:translateX(-50%)}@keyframes float{to{margin-top:12px;transform:translateX(8px)}}@media(max-width:600px){.sky{height:300px}.target{width:76%;left:12%!important}.target:nth-of-type(1){top:18px!important}.target:nth-of-type(2){top:103px!important}.target:nth-of-type(3){top:188px!important}}</style></head><body><main class="shell"><nav class="top"><a href="index.html">← Back</a><span class="score">⭐ <b id="score">0</b> XP</span></nav><section class="game"><header class="head" id="head"><small>🎯 LEVEL 1 · COMPARATIVES</small><h1>GRAMMAR SHOOTER</h1><p>Read. Aim. Shoot the right word!</p><span class="head-icon">🛸</span></header><div id="screen"><div class="status"><span>QUESTION <b id="current">1</b> / 15</span><div class="track"><div class="fill" id="progress"></div></div><span>🎯 <b id="accuracy">100%</b></span></div><div class="hud-extra"><span>🔥 STREAK <b id="streak">0</b></span><span>🎯 HITS <b id="hits">0</b></span></div><div class="stage"><p class="sentence" id="sentence"></p><p class="word">Adjective: <b id="word"></b></p><div class="sky" id="sky"><span class="blaster">🔫</span></div><p class="feedback" id="feedback"></p></div></div><section class="complete" id="complete"><div class="big">🛸</div><h2>MISSION COMPLETE!</h2><p>Great shooting, Explorer!</p><div class="stats" id="stats"></div><div class="end-actions"><a href="index.html">MISSION SELECT</a><button onclick="location.reload()">PLAY AGAIN</button><a class="primary" href="game2.html">NEXT MISSION →</a></div></section></section></main><script src="questions.js"></script><script src="game-core.js"></script><script>const q=GAME_DATA.level1,$=id=>document.getElementById(id),session=new GameSession(1,180);let lock=false;function draw(){const x=q[session.index];$('current').textContent=session.index+1;$('progress').style.width=(session.index+1)/15*100+'%';$('sentence').textContent=x.text;$('word').textContent=x.word;$('feedback').textContent='';$('feedback').className='feedback';$('sky').querySelectorAll('.target').forEach(e=>e.remove());x.options.forEach((o,n)=>{const b=document.createElement('button');b.className='target';b.textContent=o;b.style.left=[3,35.5,68][n]+'%';b.style.top=[35,110,48][n]+'px';b.onclick=()=>shoot(b,o,x.answer);$('sky').appendChild(b)});lock=false}function shoot(b,value,answer){if(lock)return;if(value===answer){lock=true;b.classList.add('hit');session.answer(true);$('hits').textContent=session.correct;$('feedback').textContent='CORRECT!';$('feedback').className='feedback good';document.querySelectorAll('.target').forEach(e=>e.disabled=true);setTimeout(next,700)}else{b.classList.add('miss');b.disabled=true;session.answer(false);$('feedback').textContent='TRY AGAIN';$('feedback').className='feedback bad'}}function next(){if(session.index<14){session.index++;session.updateHUD();draw()}else finish()}function finish(){const s=session.complete();$('screen').classList.add('hidden');$('head').classList.add('hidden');$('complete').classList.add('show');$('stats').innerHTML=`<div class="stat">⭐<b>${s.xp}</b>XP</div><div class="stat">🎯<b>${s.accuracy}%</b>Accuracy</div><div class="stat">🔥<b>${s.best}</b>Best streak</div><div class="stat">✅<b>${s.correct}</b>Correct</div><div class="stat">❌<b>${s.mistakes}</b>Mistakes</div>`}draw();</script></body></html>
