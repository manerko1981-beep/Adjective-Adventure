<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss Battle</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="adventure.css"><link rel="stylesheet" href="animations.css"><link rel="stylesheet" href="core.css"><style>body{--glow:#7b201f;--head:#65202e;--accent:#ff6756}.arena{position:relative;min-height:240px;margin:10px auto 18px;border:1px solid #ff765b55;border-radius:24px;background:radial-gradient(circle at 50% 100%,#932d21,#211032 68%);overflow:hidden}.dragon{position:absolute;left:50%;top:60px;transform:translateX(-50%);font-size:92px;filter:drop-shadow(0 15px 20px #000);transition:.2s}.bossbar{position:absolute;left:10%;right:10%;top:15px;height:18px;border:2px solid #ffd1c5;border-radius:20px;background:#301018;overflow:hidden}.bosshp{height:100%;width:100%;background:linear-gradient(90deg,#ffb02e,#ff3f4f);transition:.5s}.hp-label{position:absolute;top:38px;left:0;right:0;text-align:center;font-size:12px;font-weight:900}.damage{position:absolute;left:57%;top:75px;color:#ffe26a;font-size:28px;font-weight:900;opacity:0}.damage.show{animation:damagePop .8s}.controls{max-width:780px;margin:auto}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{padding:14px;border:1px solid #984755;border-radius:14px;color:#fff;background:#351323;font:900 15px Nunito;cursor:pointer}.choice:hover{transform:translateY(-3px);border-color:#ff8068}.choice.goodpick{background:#128b68}.choice.badpick{background:#812944}.degree{grid-template-columns:repeat(2,1fr)}.answerbox{display:flex;gap:10px}.answerbox input{flex:1;min-width:0;padding:15px;border:2px solid #834252;border-radius:14px;color:#fff;background:#190d25;font:800 17px Nunito}.answerbox .check{margin:0}.phase{text-align:center;color:#ffc65a;font-size:12px;font-weight:900;letter-spacing:2px}.shields{text-align:center;color:#79dfff;font-weight:900}@media(max-width:600px){.choices{grid-template-columns:1fr}.answerbox{flex-direction:column}.answerbox .check{width:100%}}</style></head><body><main class="shell"><nav class="top"><a href="index.html">← Back</a><span class="score">⭐ <b id="score">0</b> XP</span></nav><section class="game"><header class="head" id="head"><small>🐉 LEVEL 3 · MIXED FORMS</small><h1>BOSS BATTLE</h1><p>Adapt your strategy and defeat the Grammar Dragon!</p><span class="head-icon">⚔️</span></header><div id="screen"><div class="status"><span>QUESTION <b id="current">1</b> / 15</span><div class="track"><div class="fill" id="progress"></div></div><span>🎯 <b id="accuracy">100%</b></span></div><div class="hud-extra"><span>🔥 STREAK <b id="streak">0</b></span><span>🐉 BOSS HP <b id="hp">15</b></span></div><div class="stage"><div class="arena"><div class="bossbar"><div class="bosshp" id="bosshp"></div></div><div class="hp-label">GRAMMAR DRAGON</div><div class="dragon" id="dragon">🐉</div><div class="damage" id="damage">-1 HP</div></div><div class="shields">SHIELDS <span id="shields">💙💙💙</span></div><p class="phase" id="phase"></p><p class="sentence" id="sentence"></p><p class="word">Adjective: <b id="word"></b></p><div class="controls" id="controls"></div><p class="feedback" id="feedback"></p></div></div><section class="complete" id="complete"><div class="big">🏆</div><h2>MISSION COMPLETE!</h2><p>The Grammar Dragon is defeated!</p><div class="stats" id="stats"></div><div class="end-actions"><a href="index.html">MISSION SELECT</a><button onclick="location.reload()">PLAY AGAIN</button></div></section></section></main><script src="questions.js"></script><script src="game-core.js"></script><script>const q=GAME_DATA.level3,$=id=>document.getElementById(id),session=new GameSession(3,320);let hp=15,shields=3,lock=false;function draw(){const x=q[session.index];$('current').textContent=session.index+1;$('progress').style.width=(session.index+1)/15*100+'%';$('sentence').textContent=x.text;$('word').textContent=x.word;$('feedback').textContent='';$('feedback').className='feedback';$('phase').textContent=x.mode==='choice'?'PHASE 1 · TARGET THE RIGHT FORM':x.mode==='degree'?'PHASE 2 · COMPARATIVE OR SUPERLATIVE?':'PHASE 3 · TYPE THE ANSWER';if(x.mode==='input'){$('controls').innerHTML='<form class="answerbox" id="form"><input id="answer" autocomplete="off" spellcheck="false" placeholder="Type the full answer…"><button class="check">ATTACK ⚔️</button></form>';$('form').onsubmit=e=>{e.preventDefault();tryAnswer($('answer').value,x.answer)}}else{$('controls').innerHTML=`<div class="choices ${x.mode==='degree'?'degree':''}">${x.options.map(o=>`<button class="choice" data-value="${o}">${o}</button>`).join('')}</div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>tryAnswer(b.dataset.value,x.answer,b))}lock=false}function tryAnswer(value,answer,button){if(lock)return;value=value.trim().toLowerCase().replace(/\s+/g,' ');if(!value){$('feedback').textContent='TYPE AN ANSWER FIRST';$('feedback').className='feedback bad';return}if(value===answer){lock=true;session.answer(true);hp--;$('hp').textContent=hp;$('bosshp').style.width=hp/15*100+'%';if(button)button.classList.add('goodpick');document.querySelectorAll('.choice').forEach(e=>e.disabled=true);$('dragon').classList.add('hit');$('damage').classList.add('show');$('feedback').textContent='DIRECT HIT!';$('feedback').className='feedback good';setTimeout(()=>{$('dragon').classList.remove('hit');$('damage').classList.remove('show');next()},800)}else{session.answer(false);shields=Math.max(0,shields-1);$('shields').textContent='💙'.repeat(shields)+'🖤'.repeat(3-shields);if(button){button.classList.add('badpick');button.disabled=true}$('dragon').classList.add('attack');setTimeout(()=>$('dragon').classList.remove('attack'),450);$('feedback').textContent=shields?'BOSS ATTACK · TRY AGAIN':'SHIELDS DOWN · KEEP FIGHTING';$('feedback').className='feedback bad'}}function next(){if(session.index<14){session.index++;session.updateHUD();draw()}else finish()}function finish(){const s=session.complete();$('screen').classList.add('hidden');$('head').classList.add('hidden');$('complete').classList.add('show');$('stats').innerHTML=`<div class="stat">⭐<b>${s.xp}</b>XP</div><div class="stat">🎯<b>${s.accuracy}%</b>Accuracy</div><div class="stat">🔥<b>${s.best}</b>Best streak</div><div class="stat">✅<b>${s.correct}</b>Correct</div><div class="stat">❌<b>${s.mistakes}</b>Mistakes</div>`;confetti()}function confetti(){for(let n=0;n<45;n++){const p=document.createElement('i');p.style.cssText=`position:fixed;z-index:50;left:${Math.random()*100}%;top:-20px;width:8px;height:14px;background:hsl(${Math.random()*360} 90% 60%);animation:fall ${2+Math.random()*2}s linear forwards`;document.body.appendChild(p);setTimeout(()=>p.remove(),4200)}}const style=document.createElement('style');style.textContent='@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}';document.head.appendChild(style);draw();</script></body></html>
