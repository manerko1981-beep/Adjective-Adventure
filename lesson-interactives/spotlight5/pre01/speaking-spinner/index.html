<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotlight 5 PRE-01 — Speaking Spinner</title><style>:root{--ink:#17324d;--muted:#60758a;--purple:#7656d9;--line:#dddff0;--gold:#f5c85b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(145deg,#f3f0ff,#eef8ff 60%,#fff8e8);color:var(--ink);min-height:100vh}.app{max-width:900px;margin:auto;padding:18px;text-align:center}h1{margin:0;font-size:clamp(24px,4vw,40px)}.sub{color:var(--muted);font-weight:800;margin:7px 0 20px}.stage{background:#fff;border:2px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 32px #17324d12}.wheel{width:min(260px,64vw);aspect-ratio:1;border-radius:50%;margin:0 auto 20px;background:conic-gradient(#7656d9 0 30deg,#69a8ff 30deg 60deg,#48b795 60deg 90deg,#f4b94f 90deg 120deg,#ed7f9f 120deg 150deg,#7656d9 150deg 180deg,#69a8ff 180deg 210deg,#48b795 210deg 240deg,#f4b94f 240deg 270deg,#ed7f9f 270deg 300deg,#7656d9 300deg 330deg,#69a8ff 330deg 360deg);border:12px solid #fff;box-shadow:0 0 0 3px var(--line),0 12px 26px #17324d22;position:relative;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}.wheel:after{content:'★';position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:white;color:var(--gold);font-size:42px;box-shadow:0 5px 14px #17324d20}.prompt{min-height:92px;display:grid;place-items:center;font-size:clamp(24px,4vw,34px);font-weight:900;padding:12px}.frame{color:var(--muted);font-weight:800;min-height:54px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:15px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer;background:var(--purple);color:#fff}.btn.secondary{background:#334b62}.timer{display:inline-block;margin-top:16px;background:#fff7d8;border:2px solid #efd071;border-radius:999px;padding:8px 16px;font-size:22px;font-weight:900}.tip{margin-top:16px;background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--muted);font-weight:750}.spin{transform:rotate(1080deg)}@media(max-width:600px){.app{padding:10px}.stage{padding:16px}}</style></head><body><div class="app"><h1>Speaking Spinner</h1><div class="sub">SPIN → THINK → SPEAK FOR 30 SECONDS</div><main class="stage"><div class="wheel" id="wheel"></div><div class="prompt" id="prompt">Press SPIN!</div><div class="frame" id="frame">Use 3–5 full sentences.</div><div class="buttons"><button class="btn" id="spin">🎯 SPIN</button><button class="btn secondary" id="timerBtn">⏱ Start 30 sec</button></div><div class="timer" id="timer">00:30</div><div class="tip">Round 1: use the sentence starters. Round 2: spin again and speak with less support.</div></main></div><script>
const prompts=[['My favourite subject','My favourite subject is … because … . We … in this lesson.'],['A subject I don’t like','I don’t really like … because … . It is … for me.'],['My first lesson','My first lesson is usually … . It starts at … .'],['My school bag','In my school bag I have … . I always take … .'],['My classroom','My classroom is … . There is / There are … .'],['My best school day','My best school day is … because … . I have … on this day.'],['After-school activities','After school I usually … . Then I … .'],['A school rule','At school we must / mustn’t … . I think this rule is … .'],['A club I want to join','I want to join the … club because … .'],['My Monday timetable','On Monday I have … . My first lesson is … .'],['Something easy at school','… is easy for me because … .'],['Something difficult at school','… is difficult for me, but I can … .']];let rot=0,timer=null,left=30;const wheel=document.getElementById('wheel'),prompt=document.getElementById('prompt'),frame=document.getElementById('frame'),timerEl=document.getElementById('timer');document.getElementById('spin').onclick=()=>{rot+=720+Math.floor(Math.random()*360);wheel.style.transform=`rotate(${rot}deg)`;const x=prompts[Math.floor(Math.random()*prompts.length)];setTimeout(()=>{prompt.textContent=x[0];frame.textContent='💬 '+x[1]},650)};document.getElementById('timerBtn').onclick=()=>{clearInterval(timer);left=30;timerEl.textContent='00:30';timer=setInterval(()=>{left--;timerEl.textContent='00:'+String(left).padStart(2,'0');if(left<=0){clearInterval(timer);timerEl.textContent='⭐ DONE!'}},1000)};</script></body></html>
