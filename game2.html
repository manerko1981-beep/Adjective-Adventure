<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treasure Quest</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="adventure.css"><link rel="stylesheet" href="animations.css"><link rel="stylesheet" href="core.css"><style>body{--glow:#6540a3;--head:#4b247a;--accent:#c15cff}.map{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px auto 25px;max-width:730px}.path{position:absolute;inset:50% 5%;height:3px;background:repeating-linear-gradient(90deg,#b665e8 0 12px,transparent 12px 24px);z-index:0}.tile{position:relative;z-index:1;height:72px;display:grid;place-items:center;border:1px solid #806097;border-radius:18px;background:#15112e;font-size:27px;opacity:.48;transition:.5s}.tile.active{opacity:1;border-color:#e17aff;box-shadow:0 0 24px #c45cff;background:#482260}.tile.done{opacity:1;border-color:#ffd259;background:#7c5c1d;box-shadow:0 0 20px #ffd259}.hero-token{position:absolute;z-index:3;font-size:32px;transition:all .7s cubic-bezier(.2,1.4,.5,1);filter:drop-shadow(0 8px 8px #000)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:800px;margin:18px auto}.choice{padding:14px 10px;border:1px solid #895cad;border-radius:14px;color:#fff;background:#251142;font:900 15px Nunito;cursor:pointer;transition:.2s}.choice:hover{transform:translateY(-4px);border-color:#e47cff}.choice.goodpick{background:#128b68}.choice.badpick{background:#812944}.reward-pop{font-size:28px;text-align:center;animation:rewardGlow .7s ease-in-out infinite alternate}@media(max-width:600px){.tile{height:50px;font-size:19px}.choices{grid-template-columns:1fr}.hero-token{font-size:24px}}</style></head><body><main class="shell"><nav class="top"><a href="index.html">← Back</a><span class="score">⭐ <b id="score">0</b> XP</span></nav><section class="game"><header class="head" id="head"><small>💎 LEVEL 2 · SUPERLATIVES</small><h1>TREASURE QUEST</h1><p>Cross the planet and find the lost crown!</p><span class="head-icon">🗺️</span></header><div id="screen"><div class="status"><span>QUESTION <b id="current">1</b> / 15</span><div class="track"><div class="fill" id="progress"></div></div><span>🎯 <b id="accuracy">100%</b></span></div><div class="hud-extra"><span>🔥 STREAK <b id="streak">0</b></span><span>💎 GEMS <b id="gems">0</b></span></div><div class="stage"><div class="map" id="map"><div class="path"></div><span class="hero-token" id="hero">🧑‍🚀</span></div><p class="sentence" id="sentence"></p><p class="word">Adjective: <b id="word"></b></p><div class="choices" id="choices"></div><p class="feedback" id="feedback"></p><div class="reward-pop hidden" id="rewardPop"></div></div></div><section class="complete" id="complete"><div class="big">💎</div><h2>TREASURE FOUND!</h2><p>You found the Superlative Crown!</p><div class="stats" id="stats"></div><div class="end-actions"><a href="index.html">MISSION SELECT</a><button onclick="location.reload()">PLAY AGAIN</button><a class="primary" href="game3.html">NEXT MISSION →</a></div></section></section></main><script src="questions.js"></script><script src="game-core.js"></script><script>const q=GAME_DATA.level2,$=id=>document.getElementById(id),session=new GameSession(2,260),icons=['🌲','🌲','🌲','🌋','🌋','🌊','🌊','🏔️','🏔️','🏔️','🏰','🏰','🔑','🏰','💎'];let lock=false;for(let n=0;n<15;n++)$('map').insertAdjacentHTML('beforeend',`<div class="tile" id="tile${n}">${icons[n]}</div>`);function moveHero(){const tile=$('tile'+session.index),map=$('map'),r=tile.getBoundingClientRect(),m=map.getBoundingClientRect();$('hero').style.left=r.left-m.left+r.width/2-16+'px';$('hero').style.top=r.top-m.top+r.height/2-24+'px'}function draw(){const x=q[session.index];$('current').textContent=session.index+1;$('progress').style.width=(session.index+1)/15*100+'%';$('sentence').textContent=x.text;$('word').textContent=x.word;$('feedback').textContent='';$('feedback').className='feedback';$('choices').innerHTML=x.options.map(o=>`<button class="choice" data-value="${o}">${o}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(b,b.dataset.value,x.answer));$('tile'+session.index).classList.add('active');setTimeout(moveHero,40);lock=false}function pick(b,value,answer){if(lock)return;if(value===answer){lock=true;b.classList.add('goodpick');session.answer(true);$('gems').textContent=session.correct;document.querySelectorAll('.choice').forEach(e=>e.disabled=true);$('tile'+session.index).classList.add('done');$('feedback').textContent='PATH OPEN!';$('feedback').className='feedback good';if([4,9,14].includes(session.index)){const rewards={4:'🪙 COIN FOUND!',9:'🔑 MAGIC KEY!',14:'💎 CROWN FOUND!'};$('rewardPop').textContent=rewards[session.index];$('rewardPop').classList.remove('hidden')}setTimeout(next,[4,9,14].includes(session.index)?1200:700)}else{b.classList.add('badpick');b.disabled=true;session.answer(false);$('feedback').textContent='WRONG PATH · TRY AGAIN';$('feedback').className='feedback bad'}}function next(){$('rewardPop').classList.add('hidden');if(session.index<14){session.index++;session.updateHUD();draw()}else finish()}function finish(){const s=session.complete();$('screen').classList.add('hidden');$('head').classList.add('hidden');$('complete').classList.add('show');$('stats').innerHTML=`<div class="stat">⭐<b>${s.xp}</b>XP</div><div class="stat">🎯<b>${s.accuracy}%</b>Accuracy</div><div class="stat">🔥<b>${s.best}</b>Best streak</div><div class="stat">✅<b>${s.correct}</b>Correct</div><div class="stat">❌<b>${s.mistakes}</b>Mistakes</div>`}addEventListener('resize',moveHero);draw();</script></body></html>
